apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-model-metadata
  namespace: production
data:
  model_name: iris-logistic-regression
  model_alias: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: inference-reader
  namespace: production
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["inference-model-metadata"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: inference-reader
  namespace: production
subjects:
  - kind: ServiceAccount
    name: inference
    namespace: production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: inference-reader
