apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: infra-tools

spec:
  project: default

  source:
    repoURL: https://github.com/Your-Natka/eks-vpc-argocd.git
    targetRevision: lesson-9
    path: argocd/charts/minio

    helm:
      values: |
        mode: standalone

        fullnameOverride: minio

        auth:
          rootUser: minioadmin
          rootPassword: minioadmin123

        defaultBuckets: mlflow-artifacts

        persistence:
          enabled: true
          storageClass: gp2
          size: 5Gi

        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

        service:
          type: ClusterIP
          ports:
            api: 9000
            console: 9001

  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
