apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces
  namespace: infra-tools
spec:
  project: default

  source:
    repoURL: https://github.com/Your-Natka/eks-vpc-argocd.git
    targetRevision: final-project
    path: final/namespaces

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
