apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow
  namespace: infra-tools
spec:
  project: default

  source:
    chart: mlflow
    repoURL: https://community-charts.github.io/helm-charts
    targetRevision: "1.6.2"

    helm:
      values: |
        fullnameOverride: mlflow

        telemetry:
          enabled: false

        service:
          enabled: true
          type: ClusterIP
          port: 5000
          containerPort: 5000

        backendStore:
          databaseMigration: true
          databaseConnectionCheck: true

          postgres:
            enabled: true
            host: postgres
            port: 5432
            database: mlflow
            user: mlflow
            password: mlflow123
            driver: psycopg2

        postgresql:
          enabled: false

        mysql:
          enabled: false

        artifactRoot:
          proxiedArtifactStorage: true

          defaultArtifactRoot: s3://mlflow-artifacts

          s3:
            enabled: true
            bucket: mlflow-artifacts
            awsAccessKeyId: minioadmin
            awsSecretAccessKey: minioadmin123

        auth:
          enabled: false

        extraEnvVars:
          MLFLOW_S3_ENDPOINT_URL: http://minio:9000
          AWS_DEFAULT_REGION: us-east-1

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
