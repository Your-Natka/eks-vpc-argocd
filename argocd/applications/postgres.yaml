apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: infra-tools
spec:
  project: default

  source:
    chart: postgresql
    repoURL: https://charts.bitnami.com/bitnami
    targetRevision: "16.7.21"
    helm:
      values: |
        fullnameOverride: postgres

        auth:
          postgresPassword: postgres123
          username: mlflow
          password: mlflow123
          database: mlflow

        primary:
          persistence:
            enabled: true
            size: 5Gi

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
